[project]
name = "screening-room"
version = "0.0.0"
description = "Workspace for a personal cinema pipeline: Letterboxd watchlist fetcher + showtimes-aware Streamlit dashboard, sharing a common library and parquet contracts."
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*", "movies_management", "cinema_dashboard"]

# Internal packages resolve from the workspace, never PyPI.
[tool.uv.sources]
common = { workspace = true }
contracts = { workspace = true }

# Shared dev toolchain — defined once here instead of triplicated across members.
[dependency-groups]
dev = [
    "ruff==0.16.3",
    "mypy>=2.3.0",
    # Advisory second type checker, non-blocking in CI while it is pre-1.0 — see
    # the `ty` note under [tool.mypy] below. Pinned exactly (like ruff and bandit)
    # because a 0.0.x bump can change diagnostics without a stability guarantee.
    "ty==0.0.72",
    "bandit==1.9.4",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "pip-audit==2.10.1",
    "ipykernel>=7.3.0",
]

# Single source of truth for ruff + mypy across the whole workspace.
# (Per-member pytest config stays in each member — pythonpath/markers/asyncio differ.)
[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

# `cinema_dashboard` runs with `pythonpath = ["."]`, so its layer packages are imported
# by bare name (`core.taste`, `sources.loader`, …) from a directory ruff's isort cannot
# see from the workspace root. Left to its heuristics, ruff calls a module first-party
# only inside its *own* package — so `from sources.streaming import …` would be a
# first-party import in `sources/loader.py` but a third-party one everywhere else, and
# the same file's import block would be grouped differently depending on where it lives.
# Declaring them pins one grouping for every file.
[tool.ruff.lint.isort]
known-first-party = ["chat", "config", "core", "integrations", "pages", "pipeline", "sources", "ui"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

# ty (Astral's checker) runs beside mypy in CI, non-blocking. mypy stays the gate:
# ty is pre-1.0 and makes no stability promise yet. It needs no config here — the
# Python version comes from `requires-python`, and it resolves each member's
# bare-name imports (`core.taste`, `sources.loader`) from the file's own project
# directory, so no `extra-paths` is required. Two behavioural differences worth
# knowing before promoting it to the gate:
#   - It has no `ignore_missing_imports` equivalent; an unresolvable import is an
#     error. That is stricter than the setting above, which silently swallows a
#     misspelled third-party import. The workspace currently has none.
#   - It infers pandas types more precisely, so it reports narrowing gaps mypy
#     accepts (see the `_as_date` / `StrPath` helpers added for exactly that).
# One invocation covers every area; ~0.2s against mypy's ~22s.
[tool.ty.src]
exclude = ["**/tests/**"]
